[project]
name = "prism-twin"
version = "0.1.0"
description = "Firmware-faithful PRISM digital twin in MuJoCo"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "mujoco>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["simulation", "scripts"]
